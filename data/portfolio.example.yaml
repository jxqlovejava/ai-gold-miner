# 持仓配置示例
# 复制为 portfolio.yaml 并填入实际数据

positions:
  gold_example:
    instrument: 积存金
    platform: 京东金融
    bank: MS              # 民生银行积存金
    grams: 100.0
    avg_cost: 500.00
    hard_stop: 350
    warn_line: 360
    secondary_stop: 450
    last_reduce_at: ""        # 可选(r036): 最近实际减仓日 YYYY-MM-DD, 同波二次破位护栏锚点
    last_reduce_price: 0      # 可选(r036): 该次减仓价, 现价回到其上→护栏解除
    split:
      core: 70.0
      tactical: 30.0

limits:
  total_funds: 200000
  max_gold_pct: 80
  max_single_pct: 20
  risk_profile: balanced
  drawdown_tolerance_pct: 15
  investment_horizon: 1-3年

# r037 低吸档位真相源 (long_term.low_buy_bands) 完整结构见 data/private/portfolio.yaml:
